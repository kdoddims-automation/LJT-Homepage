# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site title, description, and URL
title                    : "Junteng Liu"
description              : "Junteng Liu's personal website"
logo                     : "/assets/images/bio-photo.jpg"
repository               : "kdoddims-automation/LJT-Homepage"
twitter_username         : "junteng88716710"
github_username         : "Vicent0205"

# Site Author
author:
  name             : "Junteng Liu"
  avatar           : "bio-photo.jpg"
  bio              : "First-year PhD candidate at HKUST NLP Group."
  location         : "Hong Kong"
  employer         : "Hong Kong University of Science and Technology"
  googlescholar    : "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  email            : "jliugi@connect.ust.hk"
  uri              :
  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
  facebook         :
  foursquare       :
  github           : "Vicent0205"
  google_plus      :
  keybase          :
  instagram        :
  impactstory      :
  lastfm           :
  linkedin         :
  dblp             :
  orcid            :
  pinterest        :
  soundcloud       :
  stackoverflow    : # http://stackoverflow.com/users/123456/username
  steam            :
  tumblr           :
  twitter          : "junteng88716710"
  vine             :
  weibo            :
  xing             :
  youtube          :
